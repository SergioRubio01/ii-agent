version: '3.8'

services:
  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: ii-agent-websocket
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - STATIC_FILE_BASE_URL=http://localhost:8000/
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ii-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ii-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      websocket-server:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    networks:
      - ii-agent-network
    restart: unless-stopped

networks:
  ii-agent-network:
    driver: bridge 